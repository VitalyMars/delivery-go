# Extends compose.yaml with reproducible service startup and database migrations.
# Run: docker compose -f compose.yaml -f compose.local.yaml up --build -d
x-app: &app
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    kafka-topics:
      condition: service_completed_successfully
x-env: &env
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Run scripts/setup-env.ps1 first}
  KAFKA_BROKERS: kafka:29092

services:
  postgres:
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d catalog_db']
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    environment:
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
  kafka-topics:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        for topic in order.ready_for_delivery delivery.courier_assigned delivery.completed
        order.ready_for_delivery.dlq delivery.courier_assigned.dlq delivery.completed.dlq; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1;
        done
  migrate:
    build:
      context: .
      args:
        SERVICE: migrate
    environment:
      DATABASE_URL: postgres://app:catalog@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  catalog:
    <<: *app
    build:
      context: .
      args:
        SERVICE: catalog
    environment:
      <<: *env
      DATABASE_URL: postgres://app:catalog@postgres:5432/catalog_db?sslmode=disable
    ports: ['127.0.0.1:8080:8080']
  user:
    <<: *app
    build:
      context: .
      args:
        SERVICE: user
    environment:
      <<: *env
      AUTH_SECRET: ${AUTH_SECRET:?Run scripts/setup-env.ps1 first}
      DATABASE_URL: postgres://app:catalog@postgres:5432/user_db?sslmode=disable
    ports: ['127.0.0.1:8083:8083']
  order:
    <<: *app
    build:
      context: .
      args:
        SERVICE: order
    environment:
      <<: *env
      AUTH_SECRET: ${AUTH_SECRET:?Run scripts/setup-env.ps1 first}
      DATABASE_URL: postgres://app:catalog@postgres:5432/order_db?sslmode=disable
      CATALOG_GRPC_ADDRESS: catalog:9090
      DEMO_PAYMENTS: ${DEMO_PAYMENTS:-false}
    ports: ['127.0.0.1:8081:8081']
  delivery:
    <<: *app
    build:
      context: .
      args:
        SERVICE: delivery
    environment:
      <<: *env
      DATABASE_URL: postgres://app:catalog@postgres:5432/delivery_db?sslmode=disable
    ports: ['127.0.0.1:8082:8082']
  notification:
    <<: *app
    build:
      context: .
      args:
        SERVICE: notification
    environment:
      <<: *env
      DATABASE_URL: postgres://app:catalog@postgres:5432/notification_db?sslmode=disable
      USER_SERVICE_GRPC_ADDRESS: user:9094
      SMTP_HOST: mailpit
    ports: ['127.0.0.1:8084:8084']
