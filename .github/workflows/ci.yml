name: Go checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: test_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d test_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:catalog@localhost:5432/test_db?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - run: go test -race ./... ./services/catalog/... ./services/order/... ./services/delivery/... ./services/notification/... ./services/user/... ./gen/...
      - run: go vet ./... ./services/catalog/... ./services/order/... ./services/delivery/... ./services/notification/... ./services/user/... ./gen/...
      - name: Check standalone modules
        run: |
          for module in . gen services/catalog services/order services/delivery services/notification services/user; do
            (cd "$module" && GOWORK=off go test -mod=readonly ./...)
          done
