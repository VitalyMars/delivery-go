syntax = "proto3";

package user.v1;

option go_package = "github.com/VitalyMars/delivery_go/gen/user/v1;userv1";

service UserService {
    rpc GetUserByID(GetUserByIDRequest) returns (GetUserByIDResponse);
}

message GetUserByIDRequest {
    string user_id = 1;
}

message GetUserByIDResponse {
    string user_id = 1;
    string name = 2;
    string email = 3;
}